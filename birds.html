<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Australian Birds</title>
    <style>
        :root {
            --primary-color: rgb(122, 148, 106);
            --secondary-color: rgb(88, 110, 78);
            --bg-color: rgb(238, 240, 230);
            --font-color: rgb(38, 45, 35);
            --heading-color: rgb(72, 92, 62);
        }

        [data-theme="dark"] {
            --primary-color: rgb(140, 168, 122);
            --secondary-color: rgb(180, 200, 160);
            --bg-color: rgb(28, 34, 28);
            --font-color: rgb(222, 230, 214);
            --heading-color: rgb(160, 190, 140);
        }

        body {
            background-color: var(--bg-color);
            color: var(--font-color);
        }

        h1 {
            color: var(--heading-color);
        }

        button {
            background-color: var(--primary-color);
            color: var(--font-color);
            border: 2px solid var(--secondary-color);
            padding: 8px 16px;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

    </style>
</head>


<body>
    <main>
        <h1>Australian Birds</h1>

        <img src="http://www.outgrabe.net/bird00.jpg" alt="Pardalote">
        <p>Pardalote by fir0002 (CC-by-NC)</p>

        <button data-bird="0">Pardalote</button>
        <button data-bird="1">Purple Swamp Hen</button>
        <button data-bird="2">White-headed Stilt</button>
        <button data-bird="3">Inland Thornbill</button>
        <button data-bird="4">Rose Robin</button>

        <button id="theme-toggle">Toggle Theme</button>
    </main>

    <script>
        const birds = [
            { src: "http://www.outgrabe.net/bird00.jpg", text: "Pardalote by fir0002 (CC-by-NC)" },
            { src: "http://www.outgrabe.net/bird01.jpg", text: "Purple swamp hen by Toby Hudson (CC-by-SA)" },
            { src: "http://www.outgrabe.net/bird02.jpg", text: "White-headed Stilt by JJ Harrison (CC-by-SA)" },
            { src: "http://www.outgrabe.net/bird03.jpg", text: "Inland Thornbill by Peter Jacobs (CC-by-SA)" },
            { src: "http://www.outgrabe.net/bird04.jpg", text: "Rose Robin by JJ Harrison (CC-by-SA)" }
        ];

        const birdImage = document.querySelector("img");
        const birdText = document.querySelector("p");

        const birdButtons = document.querySelectorAll("button[data-bird]");

        birdButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                const birdIndex = button.getAttribute("data-bird");
                birdImage.src = birds[birdIndex].src;
                birdText.textContent = birds[birdIndex].text;
            });
        });

        const themetoggle = document.querySelector("#theme-toggle");
        themetoggle.addEventListener("click", function () {
            const currentTheme = document.documentElement.getAttribute("data-theme");

            if (currentTheme === "dark") {
                document.documentElement.setAttribute("data-theme", "light");
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        });

    </script>

</body>

</html>
